<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ПРОТОКОЛ 0 | NOVA</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b18;color:#e5efff;font:16px system-ui,sans-serif;line-height:1.6}main{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;color:#80c8ff;font-size:13px;letter-spacing:2px;border-bottom:1px solid #24426a;padding:14px 0}h1{font-size:clamp(34px,7vw,70px);line-height:1.05;margin:20px 0;color:white}h2{line-height:1.2}small,.muted{color:#9bb4d4}section,.panel{background:#0d1b30;border:1px solid #28476b;border-radius:16px;padding:22px;margin:18px 0}button,input,textarea,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #4776ad}button{background:#164ba3;color:white;cursor:pointer;font-weight:700}button:hover{background:#2367ce}button:disabled{opacity:.45;cursor:default}input,textarea,select{background:#071224;color:white;width:100%}textarea{min-height:100px}video,img{width:100%;border-radius:12px}video{background:black} .hero{background:linear-gradient(90deg,#050b18ee,#050b1844),url('assets/poster.jpg') center/cover;min-height:300px;display:flex;flex-direction:column;justify-content:end}.tag{color:#72caff;font-size:12px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.option{display:block;width:100%;text-align:left;margin:8px 0;background:#101f37}.option.selected{border:2px solid #69caff;background:#193b65}.good{color:#80efb0}.bad{color:#ff9c9c}.bar{height:8px;background:#24334c;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#54c9ff}.lab{border-left:3px solid #57baff;padding:10px 15px;background:#102644}canvas{width:100%;background:#071224;border-radius:10px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}nav button{font-size:13px} .certificate{text-align:center;border:3px double #72caff;padding:30px;background:#101f37}.certificate h2{font-size:30px} @media print{body{background:white;color:black}header,nav,button,.no-print{display:none!important}main{padding:0}section{border:0;background:white}.certificate{color:black;background:white;border-color:#174b9b}.certificate .muted{color:#333}} </style><main><header><b>◉ NOVA / 2050</b><span id="status">● СИГНАЛ АКТИВЕН</span></header><nav><button onclick="home()">Команден център</button><button onclick="journal()">Дневник</button><button onclick="teacher()">За учителя</button><button id="sound" onclick="toggleSound()">Звук: вкл.</button></nav><div id="app"></div></main><script>
const $=id=>document.getElementById(id);const app=$('app');let state={name:'',done:[],notes:{},sound:true};try{state={...state,...JSON.parse(localStorage.getItem('protocol0')||'{}')}}catch(e){}let current=0,selected=-1;function save(){try{localStorage.setItem('protocol0',JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tone(ok=true){if(!state.sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?660:180;g.gain.value=.07;o.start();o.stop(a.currentTime+.18);o.onended=()=>a.close()}catch(e){}}function toggleSound(){state.sound=!state.sound;save();$('sound').textContent='Звук: '+(state.sound?'вкл.':'изкл.')} $('sound').textContent='Звук: '+(state.sound?'вкл.':'изкл.');
const tasks=[
['01 / Автомобилът','В симулирания свят автомобил спира рязко, но свободно стояща фигурка не продължава напред.','Постави фигурка върху количка. Задвижи и спри количката. Наблюдавай фигурката.','Какво се случва с фигурката при рязко спиране?',['Продължава напред спрямо количката.','Отлита назад.','Винаги остава неподвижна спрямо количката.'],0,'Инерцията обяснява запазването на скоростта до действие на сила.'],
['02 / Космическият кораб','Кораб в далечния космос спира веднага след изключване на двигателите, въпреки че резултантната сила е нула.','Сравни движението на топче върху гладка и грапава повърхност.','Как се движи корабът при нулева резултантна сила?',['Забавя се.','Равномерно и праволинейно.','Ускорява се.'],1,'При нулева резултантна сила скоростта е постоянна.'],
['03 / Монетата','Монета върху картон над чаша следва картона при рязкото му издърпване.','Постави монета върху картон над пластмасова чаша. Издърпай картона рязко хоризонтално.','Какво очакваш при успешно изпълнен опит?',['Монетата излита нагоре.','Монетата следва картона далеч.','Монетата пада в чашата.'],2,'Малкият хоризонтален импулс позволява на монетата да остане приблизително на място, а тежестта я ускорява надолу.'],
['04 / Лаборатория на движението','NOVA твърди, че всяко движещо се тяло спира само, без действие на сила.','Използвай симулацията. Сравни графиката при нулево и ненулево забавяне от триене.','Защо топчето спира върху грапава повърхност?',['Поради сила на триене.','Защото скоростта сама изчезва.','Защото масата става нула.'],0,'Триенето създава ненулева резултантна сила и променя скоростта.'],
['05 / Баланс на силите','Две противоположни сили по 5 N действат върху тяло. NOVA отчита ускорение.','Начертай двете сили с еднаква дължина и противоположни посоки.','Каква е резултантната сила?',['10 N','0 N','5 N'],1,'Равни противоположни сили имат нулева векторна сума.'],
['06 / Секретният архив','Системата изисква да възстановиш липсващия закон.','Обобщи наблюденията си от предходните мисии.','Кое твърдение е вярно в инерциална отправна система?',['Всяко движение изисква постоянна резултантна сила.','Нулева сила означава задължително покой.','При нулева резултантна сила скоростта е постоянна.'],2,'Това е първият принцип на механиката — законът за инерцията.']];
function home(){app.innerHTML=`<section class="hero"><span class="tag">СЕЗОН I / НАРУШЕНИТЕ ЗАКОНИ</span><h1>ПРОТОКОЛ 0</h1><p>Секретен команден център • 2050</p></section><section><h2>Епизод 01: Изчезналата инерция</h2><video controls playsinline preload="metadata" poster="assets/nova.jpg" src="assets/intro.mp4"></video><p>Агент, гледай посланието. Аномалиите са измислени — твоите доказателства трябва да бъдат реални.</p><label for="agent">Кодово име</label><input id="agent" maxlength="40" value="${esc(state.name)}" placeholder="PHYS-X"><p><button onclick="start()">${state.done.length?'Продължи мисията':'Активирай мисията'}</button></p><div class="bar"><div style="width:${state.done.length/6*100}%"></div></div><p>${state.done.length}/6 изпитания • ${state.done.length*100} XP</p></section><div class="grid"><section><span class="tag">ЗАКЛЮЧЕНО</span><h3>02 / Непознатата сила</h3>Втори принцип на механиката • предстои</section><section><span class="tag">ЗАКЛЮЧЕНО</span><h3>03 / Невъзможното завръщане</h3>Трети принцип • предстои</section></div>`}function start(){let n=$('agent').value.trim();if(!n){$('agent').focus();return}state.name=n;save();let i=tasks.findIndex((_,i)=>!state.done.includes(i));i<0?finish():mission(i)}
function mission(i){current=i;selected=-1;let t=tasks[i];app.innerHTML=`<section><span class="tag">АГЕНТ ${esc(state.name)} / ${state.done.length*100} XP</span><div class="bar"><div style="width:${state.done.length/6*100}%"></div></div><h2>${t[0]}</h2><p>${t[1]}</p><div class="lab"><b>🔬 Реален експеримент</b><p>${t[2]}</p></div>${i===3?'<div class="panel"><label>Начална скорост: <span id="vv">4</span> m/s</label><input id="v" type="range" min="1" max="8" value="4" oninput="sim()"><label>Забавяне от триене: <span id="aa">0</span> m/s²</label><input id="a" type="range" min="0" max="3" step="0.5" value="0" oninput="sim()"><canvas id="plot" width="640" height="220"></canvas><p id="simtext"></p><button onclick="animateBall()">Пусни топчето</button><canvas id="track" width="640" height="80"></canvas></div>':''}<label>Запиши наблюдението си</label><textarea id="note" oninput="state.notes[current]=this.value;save()" placeholder="Какво наблюдавах?">${esc(state.notes[i]||'')}</textarea><h3>${t[3]}</h3>${t[4].map((x,j)=>`<button class="option" onclick="choose(${j})">${String.fromCharCode(65+j)}. ${x}</button>`).join('')}<p id="feedback" role="status"></p><button id="check" disabled onclick="check()">Провери доказателството</button><button id="next" hidden onclick="advance()">Следваща мисия →</button></section>`;if(i===3)sim();window.scrollTo(0,0)}function choose(j){selected=j;document.querySelectorAll('.option').forEach((b,k)=>b.classList.toggle('selected',j===k));$('check').disabled=false}function check(){let t=tasks[current];if(selected!==t[5]){$('feedback').className='bad';$('feedback').textContent='Доказателството е отхвърлено. Опитай отново.';tone(false);return}if(!state.done.includes(current))state.done.push(current);save();tone();$('feedback').className='good';$('feedback').textContent='Потвърдено! '+t[6];$('check').hidden=true;$('next').hidden=false;document.querySelectorAll('.option').forEach(b=>b.disabled=true)}function advance(){let i=tasks.findIndex((_,i)=>!state.done.includes(i));i<0?finish():mission(i)}
function sim(){let v=+$('v').value,a=+$('a').value;$('vv').textContent=v;$('aa').textContent=a;let c=$('plot').getContext('2d');c.clearRect(0,0,640,220);c.strokeStyle='#45617d';c.beginPath();c.moveTo(45,15);c.lineTo(45,185);c.lineTo(620,185);c.stroke();c.fillStyle='#a7c5e8';c.font='13px sans-serif';c.fillText('v (m/s)',5,12);c.fillText('t (s)',595,210);for(let t=0;t<=8;t++){c.fillText(t,42+t*70,202)}for(let k=0;k<=8;k+=2)c.fillText(k,20,189-k*20);c.strokeStyle='#58caff';c.lineWidth=3;c.beginPath();for(let t=0;t<=8;t+=.05){let x=45+t*70,y=185-Math.max(0,v-a*t)*20;t===0?c.moveTo(x,y):c.lineTo(x,y)}c.stroke();$('simtext').textContent=a===0?'Скоростта остава постоянна.':`Време до спиране: ${(v/a).toFixed(2)} s.`;let q=$('track').getContext('2d');q.clearRect(0,0,640,80);q.fillStyle='#58caff';q.beginPath();q.arc(20,40,12,0,Math.PI*2);q.fill()}function animateBall(){let v=+$('v').value,a=+$('a').value,el=$('track'),c=el.getContext('2d'),start=performance.now();function frame(now){if(!el.isConnected)return;let t=Math.min(8,(now-start)/1000),u=a?Math.min(t,v/a):t,x=v*u-.5*a*u*u;c.clearRect(0,0,640,80);c.fillStyle='#58caff';c.beginPath();c.arc(20+x*9,40,12,0,Math.PI*2);c.fill();if(t<8)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function finish(){app.innerHTML=`<section><span class="tag good">ДОСТЪП РАЗРЕШЕН / 600 XP</span><h2>Архив на Нютон</h2><p>В инерциална отправна система всяко тяло запазва състоянието си на покой или равномерно праволинейно движение, ако резултантната сила върху него е нула.</p><h2>ΣF⃗ = 0 ⇒ v⃗ = const</h2><p>Инерцията е свойството на телата да запазват състоянието си на движение или покой.</p><div class="lab">⚠ NOVA: „Две тела с еднаква маса под действие на еднакви резултантни сили имат различни ускорения. Някой продължава да променя законите...“</div></section><section class="certificate"><span>ПРОТОКОЛ 0 • АКАДЕМИЯ НА АГЕНТИТЕ</span><h2>СЕРТИФИКАТ</h2><h3>${esc(state.name)}</h3><p>Успешно завърши Епизод 01<br>Изчезналата инерция</p><h2>600 XP</h2><p>${new Date().toLocaleDateString('bg-BG')}</p></section><button onclick="window.print()">Отпечатай / запази PDF</button> <button onclick="journal()">Дневник</button>`}function journal(){app.innerHTML=`<section><h2>Агентски дневник</h2><p>Агент: ${esc(state.name||'не е въведен')} • ${state.done.length*100} XP</p>${tasks.map((t,i)=>`<h3>${t[0]} ${state.done.includes(i)?'✓':''}</h3><p>${esc(state.notes[i]||'Няма запис.')}</p>`).join('')}<button onclick="exportLog()">Изтегли дневника (.txt)</button></section>`}function exportLog(){let b=new Blob(['ПРОТОКОЛ 0\nАгент: '+state.name+'\nXP: '+state.done.length*100+'\n'+tasks.map((t,i)=>t[0]+'\n'+(state.notes[i]||'Няма запис')).join('\n\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='agent-dnevnik.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function teacher(){app.innerHTML=`<section><h2>Режисура на урока • 40 минути</h2><p>Цел: учениците да формулират първия принцип и да разграничават скорост от ускорение.</p><p>3 мин — видео и кодови имена; 7 мин — досиета 1–3; 10 мин — опити; 12 мин — симулация и изпитания 4–6; 8 мин — архив, обобщение и дневник.</p><p>Материали: количка, фигурка, топче, гладка и грапава повърхност, картон, монета, пластмасова чаша. Използвайте безопасни малки предмети.</p><p>За трите екрана: видео, мисия, демонстрация/графика. За ученици със СОП: прочетете въпросите на глас, позволете устно наблюдение и работа с партньор.</p><p>Оценяване: 100 XP за всяко успешно изпитание; повторните опити са позволени. Точките не са самостоятелна оценка. Дневникът се съхранява локално в браузъра, без централен регистър.</p><button onclick="if(confirm('Да изтрия ли локалния напредък?')){state={name:'',done:[],notes:{},sound:state.sound};save();home()}">Нулирай напредъка</button></section>`}home();</script></html>
